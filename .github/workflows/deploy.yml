name: Deploy to production

# Auto-deploy: every push to main SSHes into the VPS and runs deploy.sh.
on:
  push:
    branches: [main]
    paths-ignore:         # doc/markdown-only commits don't need a prod deploy
      - 'docs/**'
      - '**.md'
      - '.gitignore'
  workflow_dispatch: {}   # also allow a manual "Run workflow" button

# Never let two deploys run at once (they'd fight over git pull / systemctl).
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}   # optional; defaults to 22
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run deploy.sh on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" \
            "$SSH_USER@$SSH_HOST" \
            'cd /var/www/lendifyme && ./deploy.sh'
